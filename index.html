<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ナミっち Ver.3.0</title><style>body{background:#101d39;color:#eef6ff;font:16px system-ui;margin:0}main{max-width:560px;margin:auto;padding:20px}section{background:#24395c;border-radius:20px;padding:18px;margin:12px 0}button,input{font:inherit;border:0;border-radius:12px;padding:12px;margin:4px}button{background:#b9dfff;color:#142844;cursor:pointer}button:disabled{opacity:.5}progress{width:65%;accent-color:#8bc9ff}h1{text-align:center}#pet{position:relative;text-align:center;background:radial-gradient(ellipse at 50% 65%,#557cb0,#182a4c);border-radius:20px;overflow:hidden;padding:12px;min-height:220px}#pet img{display:block;width:min(100%,300px);height:auto;margin:auto;animation:breathe 2s ease-in-out infinite}#pet.react img{animation:hop .9s ease-in-out}#petEffect{position:absolute;right:12px;top:12px;font-size:38px} @keyframes breathe{50%{transform:translateY(-18px) rotate(3deg) scale(1.035)}}@keyframes hop{50%{transform:translateY(-32px) rotate(-9deg) scale(1.08)}} #pet.paused img{animation:none!important} #motionToggle{font-size:12px}small{color:#c0d3ef}#actions{display:grid;grid-template-columns:1fr 1fr}#pet{background:linear-gradient(0deg,#425c85 0 20%,transparent 20%),radial-gradient(circle at 80% 15%,#e5edff 0 5%,transparent 5.5%),linear-gradient(#17294c,#6786af)}#pet.day{background:linear-gradient(0deg,#b8a58c 0 20%,transparent 20%),linear-gradient(#83c9f1,#e5f3ff)}#pet.morning{background:linear-gradient(0deg,#8c7890 0 20%,transparent 20%),linear-gradient(#f0b6a0,#819bc9)}#pet img{position:relative;z-index:1}#fx{position:absolute;inset:0;pointer-events:none;z-index:3;font-size:42px;display:grid;place-items:center}#fx.pop{animation:burst 1.4s both}@keyframes burst{0%{opacity:0;transform:translateY(60px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1.5)}}#pet[data-action=sleep] img{animation:snooze 2s ease-in-out!important}#pet[data-action=prank] img{animation:shake .6s!important}#pet[data-action=sing] img{animation:dance 1s!important}#pet[data-action=feed] img,#pet[data-action=pudding] img{animation:chew .35s 4!important}@keyframes snooze{50%{transform:rotate(12deg) scale(.92)}}@keyframes shake{25%,75%{transform:translateX(-12px)}50%{transform:translateX(12px)}}@keyframes dance{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes chew{50%{transform:scale(1.04,.96)}}#pet.paused img,#pet.paused #fx{animation:none!important}#costume{position:absolute;z-index:2;top:4px;left:12px;font-size:35px}#petEffect{z-index:2}#battle{padding:12px;background:#152849;border-radius:12px}#closet button{font-size:14px}#pet[data-form=魔王ナミ]{box-shadow:inset 0 0 45px #a75cde}#pet[data-form=王子ナミ]{box-shadow:inset 0 0 45px #ffdc84}#pet[data-form=勇者ナミ]{box-shadow:inset 0 0 45px #8ce5cb}#pet[data-form=アイドルナミ]{box-shadow:inset 0 0 45px #ff9cd7}#pet{isolation:isolate;background:linear-gradient(0deg,#526987 0 23%,#253e65 23% 24%,transparent 24%),linear-gradient(90deg,#233d66,#49668d)!important}#pet.day{background:linear-gradient(0deg,#c6ab8a 0 23%,#a98b70 23% 24%,transparent 24%),linear-gradient(90deg,#a5d9f1,#e4f1ff)!important}#pet.morning{background:linear-gradient(0deg,#a58b9b 0 23%,transparent 23%),linear-gradient(90deg,#e7b1a3,#8ba4d2)!important}#pet:before{content:'✦　☾　✧';position:absolute;top:12px;right:12px;width:38%;height:45%;border:7px solid #b9cbe0;border-radius:40px 40px 4px 4px;background:#152b52;color:#fff;padding-top:12px;box-sizing:border-box;box-shadow:0 0 0 3px #526783}#pet.day:before{content:'☀　☁';background:#75c8f1}#pet.morning:before{content:'☀　✧';background:#eaa88e}#pet:after{content:'🛏️　　🪴';position:absolute;bottom:12px;left:8px;right:8px;font-size:44px;text-align:left;z-index:-1}#pet img{width:min(78%,260px)}#gachaPanel{scroll-margin-top:12px} 
body{background:radial-gradient(ellipse at top,#344d80,#101a32 65%);min-height:100vh}main{padding:14px}h1{letter-spacing:.08em;margin:16px 0 4px}h1 small{font-size:12px}main>p{text-align:center;color:#b9cde8}section{border:1px solid #526b94;background:#202f4b;box-shadow:0 8px 25px #080f2633}button{font-weight:600;background:linear-gradient(#d8efff,#9bc9f0);box-shadow:0 3px 0 #628db7}button:active{transform:translateY(2px)}#pet{height:320px;padding:0;background:none!important}#pet:before,#pet:after{display:none}#pet img{position:absolute;bottom:24px;left:50%;width: min(65%,240px);margin-left:calc(-1 * min(32.5%,120px));filter:drop-shadow(0 12px 8px #17213c66)}#roomArt{position:absolute;inset:0;width:100%;height:100%;z-index:0}#petEffect{font-size:25px}#costume{top:22%;left:58%;font-size:36px;filter:drop-shadow(0 2px 3px #fff)}#stats p{display:grid;grid-template-columns:76px 1fr 30px;align-items:center;gap:6px;font-size:13px;margin:10px 0}progress{width:100%;height:10px}#actions button{font-size:14px}#closet,#furniture{display:flex;flex-wrap:wrap;gap:5px}#gachaResult{min-height:40px;text-align:center;font-weight:bold;color:#ffe0a0}#roomLabel{position:absolute;top:8px;left:8px;background:#14233bbb;border-radius:20px;padding:5px 10px;font-size:12px;z-index:2}#roomItem{position:absolute;bottom:20px;right:15px;font-size:42px;z-index:1}#dex{display:flex;flex-wrap:wrap;gap:6px}#dex span{border:1px solid #7895bf;border-radius:10px;padding:8px;font-size:12px}#daily{color:#c9e3ff;font-size:13px}nav button{font-size:13px}#status{color:#ffb9b9;overflow-wrap:anywhere}
</style><main><h1>☾ ナミっち <small>Ver.3.0</small></h1><p>みんなで育てる小さなナミ</p><section id="login"><input id="nick" maxlength="20" placeholder="ニックネーム"><button id="join">参加する</button></section><div id="game" hidden><button id="shared">みんなのナミ</button><button id="personal">自分のナミ</button><nav style="display:flex;flex-wrap:wrap;justify-content:center"><button onclick="document.getElementById('gachaPanel').scrollIntoView()">🎁 ガチャ・着せ替え</button><button onclick="document.getElementById('event').scrollIntoView()">🌟 イベント</button></nav><section><small id="mode"></small><div id="pet"><svg id="roomArt" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#a6b9dc"/><stop offset="1" stop-color="#e1d9e9"/></linearGradient><linearGradient id="sky" x2="0" y2="1"><stop id="skyTop" stop-color="#182b61"/><stop id="skyBottom" offset="1" stop-color="#718fc0"/></linearGradient></defs><rect width="400" height="320" fill="url(#wall)"/><path d="M0 225H400V320H0Z" fill="#a28da7"/><path d="M0 235H400M0 265H400M0 295H400M80 225L30 320M170 225L150 320M260 225L280 320M350 225L400 320" stroke="#d2bac5" stroke-width="2"/><rect x="245" y="22" width="130" height="142" rx="50" fill="#f6eaf1" stroke="#667b9f" stroke-width="4"/><rect x="253" y="30" width="114" height="126" rx="43" fill="url(#sky)"/><g id="stars" fill="#fff4c7"><circle cx="310" cy="60" r="14"/><circle cx="270" cy="65" r="2"/><circle cx="345" cy="90" r="2"/><circle cx="280" cy="110" r="2"/></g><path d="M310 31V155M254 99H366" stroke="#f3e8f3" stroke-width="5"/><path d="M240 20Q260 80 239 169L221 169V20M380 20Q360 80 381 169H398V20" fill="#728db9"/><rect x="15" y="135" width="125" height="105" rx="10" fill="#647b9f"/><rect x="20" y="168" width="150" height="69" rx="12" fill="#f6e9e7"/><rect x="25" y="173" width="50" height="27" rx="10" fill="#fff7f4"/><rect x="76" y="173" width="94" height="64" rx="9" fill="#88acd5"/><path d="M90 180V230M110 180V230M130 180V230M150 180V230" stroke="#b8d1e9" stroke-width="2"/><ellipse cx="208" cy="280" rx="130" ry="29" fill="#d5c5e0"/><ellipse cx="208" cy="280" rx="112" ry="21" fill="none" stroke="#f6e7f3" stroke-width="3"/><rect x="20" y="55" width="115" height="7" rx="3" fill="#657a9e"/><rect x="30" y="26" width="15" height="29" rx="2" fill="#e6b9bd"/><rect x="48" y="20" width="13" height="35" rx="2" fill="#7195c0"/><rect x="65" y="30" width="16" height="25" rx="2" fill="#e8d3a7"/><path d="M355 241Q320 210 345 190Q368 209 355 241M355 241Q385 200 390 221Q380 242 355 241" fill="#6a9e8b"/><path d="M337 240H374L367 267H344Z" fill="#d6a6a2"/></svg><span id="roomLabel"></span><span id="roomItem"></span><img src="./nami.png" alt="ナミのミニキャラ"><span id="petEffect"></span><span id="costume"></span><span id="fx"></span></div><button id="motionToggle" type="button">動きを停止</button><h2 id="form"></h2><p id="msg"></p><div id="stats"></div><p id="xp"></p><div id="actions"></div><div id="battle" hidden></div></section><section id="gachaPanel"><h3>🎁 お楽しみガチャ・着せ替え</h3><small>端末保存・無料ガチャ（育成コイン消費なし）｜ N 70% / R 25% / SR 5%</small><p id="gachaResult"></p><button id="draw">ガチャを引く</button><div id="closet"></div><h3>家具コレクション</h3><div id="furniture"></div><p id="daily"></p></section><section><h3>🌟 今日のイベント</h3><p id="event"></p><button id="eventGo">イベントに挑戦</button><p id="eventResult"></p></section><section><h3>🎧 ボイス</h3><button id="voice">ナミのセリフを聞く</button><small>端末の読み上げ音声（本人録音ではありません）</small></section><section><h3>進化図鑑</h3><div id="dex"></div></section><section><h3>みんなの貢献度</h3><div id="rank"></div></section></div><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {URL,KEY} from './config.js';
const $=id=>document.getElementById(id);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function motion(on){$('pet').classList.toggle('paused',!on);$('motionToggle').textContent=on?'動きを停止':'動きを再生';}motion(!reduced);$('motionToggle').onclick=()=>motion($('pet').classList.contains('paused')); let db,mode='shared',busy=false,user;const actions={'feed':'🍚 ごはん','sleep':'💤 お昼寝','play':'🎾 遊ぶ','sing':'🎤 歌の練習','pet':'💙 なでなで','prank':'😈 いたずら','quest':'⚔️ 冒険','pudding':'🍮 プリン'};function error(e){$('status').textContent=e.message||String(e)}async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}async function refresh(){if(!user)return;const m=mode;const s=await rpc('nami_state',{p_mode:m});if(m!==mode)return;$('mode').textContent=m==='shared'?'全員参加型':'個人育成';$('form').textContent=s.form;$('pet').dataset.form=s.form;$('petEffect').textContent=({'魔王ナミ':'😈','王子ナミ':'👑','勇者ナミ':'⚔️','プリンナミ':'🍮','アイドルナミ':'🎤','甘えん坊ナミ':'🐶'})[s.form]||'';$('msg').textContent=s.msg;$('stats').replaceChildren(...['満腹度','元気','ご機嫌','魅力','なつき度'].map((n,i)=>{let p=document.createElement('p'),b=document.createElement('progress');b.max=100;b.value=s.stats[i];let l=document.createElement('span'),v=document.createElement('span');l.textContent=n;v.textContent=s.stats[i];p.append(l,b,v);return p}));$('xp').textContent=`Lv.${1+Math.floor(s.xp/50)}　🪙 ${s.coins}`;$('dex').replaceChildren(...['幼少期ナミ','甘えん坊ナミ','プリンナミ','アイドルナミ','勇者ナミ','王子ナミ','魔王ナミ',...s.forms].filter((x,i,a)=>a.indexOf(x)===i).map(x=>{let e=document.createElement('span');e.textContent=s.forms.includes(x)?'✓ '+x:'🔒 '+x;return e}));let r=await rpc('nami_rank',{});$('rank').replaceChildren(...r.map((x,i)=>{let p=document.createElement('p');p.textContent=`${i+1}. ${x.nick}　${x.score} pt`;return p}))}for(const [k,v] of Object.entries(actions)){let b=document.createElement('button');b.textContent=v;b.onclick=async()=>{if(busy)return;busy=true;try{await rpc('nami_action',{p_mode:mode,p_action:k});await refresh();effect(k);$('pet').classList.remove('react');void $('pet').offsetWidth;$('pet').classList.add('react');setTimeout(()=>$('pet').classList.remove('react'),950);$('status').textContent=''}catch(e){error(e)}finally{busy=false}};$('actions').append(b)}for(const m of ['shared','personal'])$(m).onclick=()=>{mode=m;refresh().catch(error)};$('join').onclick=async()=>{try{if(!db)throw Error('公開設定が必要です');let nick=$('nick').value.trim();if(!nick)throw Error('名前を入力してください');let {data,error:e}=await db.auth.getSession();if(e)throw e;if(!data.session){let r=await db.auth.signInAnonymously();if(r.error)throw r.error;data=r.data}user=data.session.user;await rpc('nami_join',{p_nick:nick});$('login').hidden=true;$('game').hidden=false;loadWardrobe();await refresh()}catch(e){error(e)}};
const items=[['🎀','リボン','N','wear'],['⭐','星飾り','N','wear'],['🎩','帽子','N','wear'],['🧸','くまのぬいぐるみ','N','room'],['🪴','観葉植物','N','room'],['🎧','ヘッドホン','R','wear'],['🌙','月の飾り','R','wear'],['🛋️','ソファ','R','room'],['🎹','ピアノ','R','room'],['👑','星の王冠','SR','wear'],['💎','星空の宝石','SR','room']];let wardrobe=['なし'],wear='なし',furn='なし',draws=0;function loadWardrobe(){try{const x=JSON.parse(localStorage.getItem('nami-v2-'+user.id)||'null');if(x){wardrobe=x.wardrobe;wear=x.wear;furn=x.furn||'なし';draws=x.draws||0}}catch{}renderCloset()}function renderCloset(){$('costume').textContent=wear==='なし'?'':wear;$('roomItem').textContent=furn==='なし'?'':furn;for(const [id,type,current] of [['closet','wear',wear],['furniture','room',furn]]){$(id).replaceChildren(...['なし',...wardrobe.filter(x=>x!=='なし'&&items.find(i=>i[0]===x)?.[3]===type)].map(x=>{let b=document.createElement('button');b.textContent=(items.find(i=>i[0]===x)?.slice(0,2).join(' ')||x)+(x===current?' ✓':'');b.onclick=()=>{if(type==='wear')wear=x;else furn=x;storeWardrobe();renderCloset()};return b}))}$('daily').textContent=`コレクション ${items.filter(i=>wardrobe.includes(i[0])).length}/${items.length}　ガチャ ${draws}回`}function storeWardrobe(){try{localStorage.setItem('nami-v2-'+user.id,JSON.stringify({wardrobe,wear,furn,draws}))}catch{}}$('draw').onclick=()=>{let r=Math.random(),tier=r<.05?'SR':r<.30?'R':'N',pool=items.filter(i=>i[2]===tier),x=pool[Math.floor(Math.random()*pool.length)];draws++;$('gachaResult').textContent=`【${tier}】${x[0]} ${x[1]} ${wardrobe.includes(x[0])?'獲得済み':'GET！'}`;if(!wardrobe.includes(x[0]))wardrobe.push(x[0]);storeWardrobe();renderCloset()};
function room(){const h=new Date().getHours();let day=h>=9&&h<17,morning=h>=5&&h<9||h>=17&&h<19;$('skyTop').setAttribute('stop-color',day?'#72b9ef':morning?'#e7a6a5':'#182b61');$('skyBottom').setAttribute('stop-color',day?'#d9f3ff':morning?'#f7d6ad':'#718fc0');$('roomLabel').textContent=day?'☀ 昼のお部屋':morning?'🌅 朝夕のお部屋':'☾ 夜のお部屋';$('pet').classList.toggle('day',h>=9&&h<17);$('pet').classList.toggle('morning',h>=5&&h<9||h>=17&&h<19)}room();setInterval(room,60000);let fxTimer;function effect(k){clearTimeout(fxTimer);$('pet').dataset.action=k;const f=$('fx');f.textContent=({feed:'🍚 ✨',sleep:'💤',play:'🎾 ✨',sing:'♫ ♪',pet:'💙 💗',prank:'💢',quest:'⚔️ ✨',pudding:'🍮 💕'})[k];f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');if(k==='quest'){$('battle').hidden=false;$('battle').textContent='⚔️ 星空の森から帰ってきた！ 最新の育成結果はステータスを確認してね'}fxTimer=setTimeout(()=>{delete $('pet').dataset.action;f.textContent='';f.classList.remove('pop')},2100)}
const events=[['お腹ぺこぺこ！','feed'],['星空の森を探索！','quest'],['歌の練習会！','sing'],['甘えん坊タイム！','pet']];const ev=events[Math.floor(Date.now()/86400000)%events.length];$('event').textContent=ev[0];$('eventGo').onclick=()=>{const b=$('actions').querySelectorAll('button')[Object.keys(actions).indexOf(ev[1])];if(b)b.click();$('eventResult').textContent='育成結果は上の画面で確認してね'};$('voice').onclick=()=>{if(!('speechSynthesis' in window)){$('status').textContent='この端末は読み上げ非対応です';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('msg').textContent);u.lang='ja-JP';speechSynthesis.speak(u)};
if(URL&&KEY){db=createClient(URL,KEY);setInterval(()=>refresh().catch(error),5000)}else $('status').textContent='管理者：config.js の接続設定を行ってください。';
</script></html>
