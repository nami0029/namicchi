<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ナミっち</title><style>body{background:#101d39;color:#eef6ff;font:16px system-ui;margin:0}main{max-width:560px;margin:auto;padding:20px}section{background:#24395c;border-radius:20px;padding:18px;margin:12px 0}button,input{font:inherit;border:0;border-radius:12px;padding:12px;margin:4px}button{background:#b9dfff;color:#142844;cursor:pointer}button:disabled{opacity:.5}progress{width:65%;accent-color:#8bc9ff}h1{text-align:center}#pet{position:relative;text-align:center;background:radial-gradient(ellipse at 50% 65%,#557cb0,#182a4c);border-radius:20px;overflow:hidden;padding:12px;min-height:220px}#pet img{display:block;width:min(100%,300px);height:auto;margin:auto;animation:breathe 2s ease-in-out infinite}#pet.react img{animation:hop .9s ease-in-out}#petEffect{position:absolute;right:12px;top:12px;font-size:38px} @keyframes breathe{50%{transform:translateY(-18px) rotate(3deg) scale(1.035)}}@keyframes hop{50%{transform:translateY(-32px) rotate(-9deg) scale(1.08)}} #pet.paused img{animation:none!important} #motionToggle{font-size:12px}small{color:#c0d3ef}#actions{display:grid;grid-template-columns:1fr 1fr}</style><main><h1>☾ ナミっち</h1><p>みんなで育てる小さなナミ</p><section id="login"><input id="nick" maxlength="20" placeholder="ニックネーム"><button id="join">参加する</button></section><div id="game" hidden><button id="shared">みんなのナミ</button><button id="personal">自分のナミ</button><section><small id="mode"></small><div id="pet"><img src="./nami.png" alt="ナミのミニキャラ"><span id="petEffect"></span></div><button id="motionToggle" type="button">動きを停止</button><h2 id="form"></h2><p id="msg"></p><div id="stats"></div><p id="xp"></p><div id="actions"></div></section><section><h3>進化図鑑</h3><div id="dex"></div></section><section><h3>みんなの貢献度</h3><div id="rank"></div></section></div><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {URL,KEY} from './config.js';
const $=id=>document.getElementById(id);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function motion(on){$('pet').classList.toggle('paused',!on);$('motionToggle').textContent=on?'動きを停止':'動きを再生';}motion(!reduced);$('motionToggle').onclick=()=>motion($('pet').classList.contains('paused')); let db,mode='shared',busy=false,user;const actions={'feed':'🍚 ごはん','sleep':'💤 お昼寝','play':'🎾 遊ぶ','sing':'🎤 歌の練習','pet':'💙 なでなで','prank':'😈 いたずら','quest':'⚔️ 冒険','pudding':'🍮 プリン'};function error(e){$('status').textContent=e.message||String(e)}async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}async function refresh(){if(!user)return;const m=mode;const s=await rpc('nami_state',{p_mode:m});if(m!==mode)return;$('mode').textContent=m==='shared'?'全員参加型':'個人育成';$('form').textContent=s.form;$('petEffect').textContent=({'魔王ナミ':'😈','王子ナミ':'👑','勇者ナミ':'⚔️','プリンナミ':'🍮','アイドルナミ':'🎤','甘えん坊ナミ':'🐶'})[s.form]||'';$('msg').textContent=s.msg;$('stats').replaceChildren(...['満腹度','元気','ご機嫌','魅力','なつき度'].map((n,i)=>{let p=document.createElement('p'),b=document.createElement('progress');b.max=100;b.value=s.stats[i];p.append(n+' ',b,' '+s.stats[i]);return p}));$('xp').textContent=`Lv.${1+Math.floor(s.xp/50)}　🪙 ${s.coins}`;$('dex').textContent=s.forms.join(' ／ ');let r=await rpc('nami_rank',{});$('rank').replaceChildren(...r.map((x,i)=>{let p=document.createElement('p');p.textContent=`${i+1}. ${x.nick}　${x.score} pt`;return p}))}for(const [k,v] of Object.entries(actions)){let b=document.createElement('button');b.textContent=v;b.onclick=async()=>{if(busy)return;busy=true;try{await rpc('nami_action',{p_mode:mode,p_action:k});await refresh();$('pet').classList.remove('react');void $('pet').offsetWidth;$('pet').classList.add('react');setTimeout(()=>$('pet').classList.remove('react'),950);$('status').textContent=''}catch(e){error(e)}finally{busy=false}};$('actions').append(b)}for(const m of ['shared','personal'])$(m).onclick=()=>{mode=m;refresh().catch(error)};$('join').onclick=async()=>{try{if(!db)throw Error('公開設定が必要です');let nick=$('nick').value.trim();if(!nick)throw Error('名前を入力してください');let {data,error:e}=await db.auth.getSession();if(e)throw e;if(!data.session){let r=await db.auth.signInAnonymously();if(r.error)throw r.error;data=r.data}user=data.session.user;await rpc('nami_join',{p_nick:nick});$('login').hidden=true;$('game').hidden=false;await refresh()}catch(e){error(e)}};if(URL&&KEY){db=createClient(URL,KEY);setInterval(()=>refresh().catch(error),5000)}else $('status').textContent='管理者：config.js の接続設定を行ってください。';
</script></html>
