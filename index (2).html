<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ナミっち</title><style>body{background:#101d39;color:#eef6ff;font:16px system-ui;margin:0}main{max-width:560px;margin:auto;padding:20px}section{background:#24395c;border-radius:20px;padding:18px;margin:12px 0}button,input{font:inherit;border:0;border-radius:12px;padding:12px;margin:4px}button{background:#b9dfff;color:#142844;cursor:pointer}button:disabled{opacity:.5}progress{width:65%;accent-color:#8bc9ff}h1{text-align:center}#pet{position:relative;text-align:center;background:radial-gradient(ellipse at 50% 65%,#557cb0,#182a4c);border-radius:20px;overflow:hidden;padding:12px;min-height:220px}#pet img{display:block;width:min(100%,300px);height:auto;margin:auto;animation:breathe 2s ease-in-out infinite}#pet.react img{animation:hop .9s ease-in-out}#petEffect{position:absolute;right:12px;top:12px;font-size:38px} @keyframes breathe{50%{transform:translateY(-18px) rotate(3deg) scale(1.035)}}@keyframes hop{50%{transform:translateY(-32px) rotate(-9deg) scale(1.08)}} #pet.paused img{animation:none!important} #motionToggle{font-size:12px}small{color:#c0d3ef}#actions{display:grid;grid-template-columns:1fr 1fr}#pet{background:linear-gradient(0deg,#425c85 0 20%,transparent 20%),radial-gradient(circle at 80% 15%,#e5edff 0 5%,transparent 5.5%),linear-gradient(#17294c,#6786af)}#pet.day{background:linear-gradient(0deg,#b8a58c 0 20%,transparent 20%),linear-gradient(#83c9f1,#e5f3ff)}#pet.morning{background:linear-gradient(0deg,#8c7890 0 20%,transparent 20%),linear-gradient(#f0b6a0,#819bc9)}#pet img{position:relative;z-index:1}#fx{position:absolute;inset:0;pointer-events:none;z-index:3;font-size:42px;display:grid;place-items:center}#fx.pop{animation:burst 1.4s both}@keyframes burst{0%{opacity:0;transform:translateY(60px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1.5)}}#pet[data-action=sleep] img{animation:snooze 2s ease-in-out!important}#pet[data-action=prank] img{animation:shake .6s!important}#pet[data-action=sing] img{animation:dance 1s!important}#pet[data-action=feed] img,#pet[data-action=pudding] img{animation:chew .35s 4!important}@keyframes snooze{50%{transform:rotate(12deg) scale(.92)}}@keyframes shake{25%,75%{transform:translateX(-12px)}50%{transform:translateX(12px)}}@keyframes dance{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes chew{50%{transform:scale(1.04,.96)}}#pet.paused img,#pet.paused #fx{animation:none!important}#costume{position:absolute;z-index:2;top:4px;left:12px;font-size:35px}#petEffect{z-index:2}#battle{padding:12px;background:#152849;border-radius:12px}#closet button{font-size:14px}#pet[data-form=魔王ナミ]{box-shadow:inset 0 0 45px #a75cde}#pet[data-form=王子ナミ]{box-shadow:inset 0 0 45px #ffdc84}#pet[data-form=勇者ナミ]{box-shadow:inset 0 0 45px #8ce5cb}#pet[data-form=アイドルナミ]{box-shadow:inset 0 0 45px #ff9cd7}</style><main><h1>☾ ナミっち</h1><p>みんなで育てる小さなナミ</p><section id="login"><input id="nick" maxlength="20" placeholder="ニックネーム"><button id="join">参加する</button></section><div id="game" hidden><button id="shared">みんなのナミ</button><button id="personal">自分のナミ</button><section><small id="mode"></small><div id="pet"><img src="./nami.png" alt="ナミのミニキャラ"><span id="petEffect"></span><span id="costume"></span><span id="fx"></span></div><button id="motionToggle" type="button">動きを停止</button><h2 id="form"></h2><p id="msg"></p><div id="stats"></div><p id="xp"></p><div id="actions"></div><div id="battle" hidden></div></section><section><h3>🎁 お楽しみガチャ・着せ替え</h3><small>端末限定・無料ガチャ（育成コインは消費しません）</small><p id="gachaResult"></p><button id="draw">ガチャを引く</button><div id="closet"></div></section><section><h3>🌟 今日のイベント</h3><p id="event"></p><button id="eventGo">イベントに挑戦</button><p id="eventResult"></p></section><section><h3>🎧 ボイス</h3><button id="voice">ナミのセリフを聞く</button><small>端末の読み上げ音声（本人録音ではありません）</small></section><section><h3>進化図鑑</h3><div id="dex"></div></section><section><h3>みんなの貢献度</h3><div id="rank"></div></section></div><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {URL,KEY} from './config.js';
const $=id=>document.getElementById(id);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function motion(on){$('pet').classList.toggle('paused',!on);$('motionToggle').textContent=on?'動きを停止':'動きを再生';}motion(!reduced);$('motionToggle').onclick=()=>motion($('pet').classList.contains('paused')); let db,mode='shared',busy=false,user;const actions={'feed':'🍚 ごはん','sleep':'💤 お昼寝','play':'🎾 遊ぶ','sing':'🎤 歌の練習','pet':'💙 なでなで','prank':'😈 いたずら','quest':'⚔️ 冒険','pudding':'🍮 プリン'};function error(e){$('status').textContent=e.message||String(e)}async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}async function refresh(){if(!user)return;const m=mode;const s=await rpc('nami_state',{p_mode:m});if(m!==mode)return;$('mode').textContent=m==='shared'?'全員参加型':'個人育成';$('form').textContent=s.form;$('pet').dataset.form=s.form;$('petEffect').textContent=({'魔王ナミ':'😈','王子ナミ':'👑','勇者ナミ':'⚔️','プリンナミ':'🍮','アイドルナミ':'🎤','甘えん坊ナミ':'🐶'})[s.form]||'';$('msg').textContent=s.msg;$('stats').replaceChildren(...['満腹度','元気','ご機嫌','魅力','なつき度'].map((n,i)=>{let p=document.createElement('p'),b=document.createElement('progress');b.max=100;b.value=s.stats[i];p.append(n+' ',b,' '+s.stats[i]);return p}));$('xp').textContent=`Lv.${1+Math.floor(s.xp/50)}　🪙 ${s.coins}`;$('dex').textContent=s.forms.join(' ／ ');let r=await rpc('nami_rank',{});$('rank').replaceChildren(...r.map((x,i)=>{let p=document.createElement('p');p.textContent=`${i+1}. ${x.nick}　${x.score} pt`;return p}))}for(const [k,v] of Object.entries(actions)){let b=document.createElement('button');b.textContent=v;b.onclick=async()=>{if(busy)return;busy=true;try{await rpc('nami_action',{p_mode:mode,p_action:k});await refresh();effect(k);$('pet').classList.remove('react');void $('pet').offsetWidth;$('pet').classList.add('react');setTimeout(()=>$('pet').classList.remove('react'),950);$('status').textContent=''}catch(e){error(e)}finally{busy=false}};$('actions').append(b)}for(const m of ['shared','personal'])$(m).onclick=()=>{mode=m;refresh().catch(error)};$('join').onclick=async()=>{try{if(!db)throw Error('公開設定が必要です');let nick=$('nick').value.trim();if(!nick)throw Error('名前を入力してください');let {data,error:e}=await db.auth.getSession();if(e)throw e;if(!data.session){let r=await db.auth.signInAnonymously();if(r.error)throw r.error;data=r.data}user=data.session.user;await rpc('nami_join',{p_nick:nick});$('login').hidden=true;$('game').hidden=false;loadWardrobe();await refresh()}catch(e){error(e)}};
const outfits=['なし','🎀','👑','🎩','🌙','⭐','🎧'];let wardrobe=['なし'],wear='なし';function loadWardrobe(){try{const x=JSON.parse(localStorage.getItem('nami-v2-'+user.id)||'null');if(x){wardrobe=x.wardrobe;wear=x.wear}}catch{}renderCloset()}function renderCloset(){$('costume').textContent=wear==='なし'?'':wear;$('closet').replaceChildren(...wardrobe.map(x=>{const b=document.createElement('button');b.textContent=x+(x===wear?' ✓':'');b.onclick=()=>{wear=x;storeWardrobe();renderCloset()};return b}))}function storeWardrobe(){try{localStorage.setItem('nami-v2-'+user.id,JSON.stringify({wardrobe,wear}))}catch{}}$('draw').onclick=()=>{const x=outfits[1+Math.floor(Math.random()*(outfits.length-1))];$('gachaResult').textContent=wardrobe.includes(x)?x+' は獲得済み！':x+' を獲得！';if(!wardrobe.includes(x))wardrobe.push(x);storeWardrobe();renderCloset()};
function room(){const h=new Date().getHours();$('pet').classList.toggle('day',h>=9&&h<17);$('pet').classList.toggle('morning',h>=5&&h<9||h>=17&&h<19)}room();setInterval(room,60000);let fxTimer;function effect(k){clearTimeout(fxTimer);$('pet').dataset.action=k;const f=$('fx');f.textContent=({feed:'🍚 ✨',sleep:'💤',play:'🎾 ✨',sing:'♫ ♪',pet:'💙 💗',prank:'💢',quest:'⚔️ ✨',pudding:'🍮 💕'})[k];f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');if(k==='quest'){$('battle').hidden=false;$('battle').textContent='⚔️ 星空の森：冒険成功！ 経験値＋30 / コイン＋15'}fxTimer=setTimeout(()=>{delete $('pet').dataset.action;f.textContent='';f.classList.remove('pop')},2100)}
const events=[['お腹ぺこぺこ！','feed'],['星空の森を探索！','quest'],['歌の練習会！','sing'],['甘えん坊タイム！','pet']];const ev=events[Math.floor(Date.now()/86400000)%events.length];$('event').textContent=ev[0];$('eventGo').onclick=()=>{const b=$('actions').querySelectorAll('button')[Object.keys(actions).indexOf(ev[1])];if(b)b.click();$('eventResult').textContent='育成結果は上の画面で確認してね'};$('voice').onclick=()=>{if(!('speechSynthesis' in window)){$('status').textContent='この端末は読み上げ非対応です';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('msg').textContent);u.lang='ja-JP';speechSynthesis.speak(u)};
if(URL&&KEY){db=createClient(URL,KEY);setInterval(()=>refresh().catch(error),5000)}else $('status').textContent='管理者：config.js の接続設定を行ってください。';
</script></html>
